[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/Maps/L_Lobby")
+MapsToCook=(FilePath="/Game/Maps/L_Match")
; Varsity Valley, the 800 x 800 m battle-royale map (Scripts/build_varsity_valley.py builds it)
+MapsToCook=(FilePath="/Game/Maps/L_VarsityValley")
; Campus Grounds, the 208 m walled campus ported from the web game's CAMPUS map. Playable in Team
; Clash and in Battle Royale (CampusCatalog::Maps "CampusMap"), so it must be cooked like the others.
+MapsToCook=(FilePath="/Game/Maps/L_CampusMap")
; its merged zone meshes, box colliders, unlit materials and MPC_VarsityTime (Campus/CampusDayNight.cpp
; loads the parameter collection by path, so the cooker cannot see it from the level alone)
+DirectoriesToAlwaysCook=(Path="/Game/VarsityValley")
; the same for Campus Grounds: the 15 merged meshes, the box colliders, the 4 unlit materials and the
; 256 x 4 palette texture every surface colour rides in a UV into (Scripts/build_campusmap.py writes
; them all to this folder, and the level alone does not show the cooker the palette)
+DirectoriesToAlwaysCook=(Path="/Game/CampusMap")
+DirectoriesToAlwaysCook=(Path="/Game/CampusAnims")
+DirectoriesToAlwaysCook=(Path="/Game/CampusCharacter")
+DirectoriesToAlwaysCook=(Path="/Game/CampusFX")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Rifle")
+DirectoriesToAlwaysCook=(Path="/Game/CampusUI")
+DirectoriesToAlwaysCook=(Path="/Game/CampusAudio")
; drivable cars (Campus/CampusVehicle.cpp loads these by path in BeginPlay, like the rifle mesh):
; the migrated static meshes and their unlit campus-look material instances.
; Taken whole, so the battle royale parachute in the Parachute subfolder (Scripts/import_parachute.py:
; SM_Parachute + its texture and material, loaded by Campus/CampusBRPlane.cpp) needs no entry of its own.
+DirectoriesToAlwaysCook=(Path="/Game/CampusVehicles")
; one low-poly mesh per gun id (Scripts/build_guns.py); Campus/CampusGunMeshes.h maps id -> path
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Guns")
+DirectoriesToAlwaysCook=(Path="/Game/Campus/Materials")
; root CAs for HTTPS (the API tunnel): Android has no system bundle for libcurl, the engine loads Content/Certificates/cacert.pem
+DirectoriesToAlwaysStageAsUFS=(Path="Certificates")
; map-select banner art: loose PNGs decoded at runtime by Campus/CampusMapArt.cpp (~330 KB total,
; cheaper than a cooked texture asset per picture and regenerated by Scripts/render_map_art.py)
+DirectoriesToAlwaysStageAsUFS=(Path="CampusUI/MapArt")
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bCompressed=True
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
IncludePrerequisites=False
bGenerateChunks=False

