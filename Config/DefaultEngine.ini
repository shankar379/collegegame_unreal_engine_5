; Match traffic goes over the EOS net driver (P2P, relayed when needed) so a phone can host for
; players on mobile data or another Wi-Fi. It is not a one-way door: NetDriverEOS falls back to
; IpNetDriver by itself whenever EOS is unusable - IsAvailable() is false with no EOS keys (then
; DriverClassNameFallback is taken), a connect URL that is not "EOS:<puid>" passes straight through
; to IP sockets, and a listen URL carrying ?bUseIPSockets does the same. That is the LAN path.
