; Team voice over the match connection (no outside service). Null stays the default on purpose and
; EOS does NOT take it over: voice is replicated on the net connection itself (the voice channel on
; UNetConnection), and the EOS connection class derives from the IP one, so the same built-in VOIP
; works unchanged over EOS P2P. Nothing here is per-transport. Google Play is reached by name
; instead, from CampusPlayBilling.cpp, so turning on billing cannot disturb voice either, and EOS
; lives entirely in the v2 online-services stack (Campus/CampusEOS.cpp) where it cannot disturb
; either of them.
[OnlineSubsystem]
DefaultPlatformService=Null
bHasVoiceEnabled=true

; Google Play Billing. bSupportsInAppPurchasing is what creates the store/purchase interfaces AND what makes
; UnrealBuildTool write <uses-permission android:name="com.android.vending.BILLING"/> into the manifest.
[OnlineSubsystemGooglePlay.Store]
bSupportsInAppPurchasing=True
; Do NOT acknowledge or consume on the phone. The backend does both after it has verified the token with Google,
; so a purchase cannot be lost to a crash, a dead network or an OEM killing us between "Play charged" and
; "wallet credited" - Play keeps handing the token back until the server consumes it. Flipping this to False
; makes the client consume immediately and re-opens that hole.
bDisableLocalAcknowledgeAndConsume=True
; We bill through Google, not an alternative provider. Leave off unless Play policy for a region requires it.
EnableAlternativeBillingOnly=False

[Voice]
bEnabled=true

[/Script/Engine.GameSession]
bRequiresPushToTalk=true

; ---------------------------------------------------------------------------------------------
; Internet play: Epic Online Services P2P. Full instructions in Docs/EOS_SETUP.md.
;
; The five keys below come from one EOS product on dev.epicgames.com and are the ONLY thing the
; owner has to fill in. Leave them blank and the game stays exactly as it is today: Campus/CampusEOS.cpp
; sees an unset artifact, never calls EOS, and rooms are hosted and joined by ip:port on the LAN.
; Fill them in and a hosted room is reachable from mobile data / another Wi-Fi.

; Names the artifact section below. Also the section the EOS SDK's Android packaging step reads
; ClientId from (for the Epic sign-in redirect activity; we do not use Epic sign-in, it is harmless).
[OnlineServices.EOS]
PlatformConfigName=CampusCombat

[EOSSDK.Platform.CampusCombat]
; FILL ME: Dev Portal > Product Settings > Product ID (32 hex).
ProductId=
; FILL ME: Dev Portal > Product Settings > Sandboxes > the sandbox you ship (32 hex, usually "Live").
SandboxId=
; FILL ME: Dev Portal > Product Settings > Deployments > Deployment ID of that sandbox (32 hex).
DeploymentId=
; FILL ME: Dev Portal > Product Settings > Clients > Client ID (32 hex). Its client policy MUST allow
; "Connect" (device-id login) and "P2P", or login succeeds and the P2P socket is refused.
ClientId=
; FILL ME: the Client Secret that goes with the Client ID above.
ClientSecret=
; Optional. Only needed for EOS Title Storage / Player Data Storage, which this game does not use.
; Leave blank. (The modern key name; plain "EncryptionKey" is stripped from packaged builds.)
ClientEncryptionKey=
; Where the SDK keeps its cache - this is also where the device id for the player's login lives, so
; it must be set or the phone would create a new identity on every launch.
CacheBaseSubdirectory=CampusCombatEOS
; Don't try to load the social overlay in editor/server processes.
bCheckRuntimeType=true

; P2P transport. AllowRelays is what makes two phones behind mobile-data NAT reachable at all: EOS
; tries a direct connection first and falls back to Epic's relays. NoRelays would make most Indian
; mobile networks unplayable; ForceRelays would add latency to pairs that could have gone direct.
[SocketSubsystemEOS]
bEnable=true
RelayControl=AllowRelays

; The EOS net driver needs the EOS connection class, or it would try to open an IP socket per client.
[/Script/SocketSubsystemEOS.NetDriverEOS]
NetConnectionClassName="/Script/SocketSubsystemEOS.NetConnectionEOS"
